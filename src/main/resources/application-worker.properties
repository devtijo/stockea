# Proceso Worker: mismo JAR, otro tipo de proceso Consume eventos de RabbitMQ
# no recibe tráfico del gateway (su puerto 8080 no se publica)
PROCESO=worker
management.metrics.tags.proceso=worker
spring.rabbitmq.username=${RABBITMQ_USER:stockea_worker}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:${RABBITMQ_WORKER_PASSWORD:}}
# El worker no administra usuarios de Keycloak: no recibe ese secreto
stockea.keycloak.cliente-secreto=no-aplica-en-worker
# Su salud pública no se expone por el gateway; solo la ve Prometheus/docker
management.endpoint.health.group.readiness.include=readinessState,db,rabbit
# El worker no migra la base: eso lo hace la API al arrancar
spring.flyway.enabled=false
