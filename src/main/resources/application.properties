# Configuración por variables de entorno
spring.config.import=optional:file:.env[.properties]
spring.application.name=stockea
server.port=${PORT:8080}
# Detrás de Nginx: la IP del cliente y el esquema salen de X-Forwarded (solo de proxies internos)
server.forward-headers-strategy=native
spring.threads.virtual.enabled=true

# Base de datos: la app usa un rol SIN privilegios de dueño (RLS + REVOKE aplican)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stockea}
spring.datasource.username=${DB_APP_USER:stockea_app}
spring.datasource.password=${STOCKEA_APP_PASSWORD}

# Flyway migra con el rol dueño del esquema
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=${DB_MIGRATOR_USER:stockea_migrator}
spring.flyway.password=${STOCKEA_MIGRATOR_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Identidad: Keycloak
# Keycloak vive detrás del gateway en /auth (https://localhost/auth).
# issuer = URL pública con la que el navegador obtiene el token (se valida el "iss").
# jwk-set-uri = URL interna desde la que el backend descarga las llaves públicas.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:https://localhost/auth/realms/stockea}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URI:http://localhost:8180/auth/realms/stockea/protocol/openid-connect/certs}
stockea.keycloak.url-admin=${KEYCLOAK_INTERNAL_URL:http://localhost:8180/auth}
stockea.keycloak.realm=stockea
stockea.keycloak.cliente-id=stockea-api
stockea.keycloak.cliente-secreto=${STOCKEA_API_CLIENT_SECRET}

# Negocio
stockea.zona-negocio=${ZONA_NEGOCIO:America/Bogota}

# Logs estructurados a stdout
# Incluyen el MDC: request_id, negocio_id,usuario_id, dispositivo_id, operacion_id.
logging.structured.format.console=${LOG_FORMAT:ecs}

# Observabilidad: actuator en un puerto INTERNO que el gateway no publica.
# Prometheus lo raspa por la red interna de docker.
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

management.endpoint.health.group.readiness.show-details=never
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.proceso=${PROCESO:api}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Mensajería RabbitMQ la crea el broker
# desde infra/rabbitmq/definitions.json; la app no declara nada (mínimo privilegio).
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:stockea}
spring.rabbitmq.username=${RABBITMQ_USER:stockea_api}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:${RABBITMQ_API_PASSWORD:}}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Consumidor (perfil worker): 3 intentos con espera creciente y luego a la DLQ, nunca de vuelta a la cola.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=20
stockea.mensajeria.cola-velocidad=analitica.velocidad-venta

# Outbox de eventos de Modulith: la tabla la crea Flyway (V5), nunca la app.
spring.modulith.events.jdbc.schema-initialization.enabled=false
spring.modulith.events.completion-mode=delete
spring.modulith.events.republish-outstanding-events-on-restart=true

# Reposición: menos de N días de cobertura -> "REPONER"
stockea.reposicion.dias-alerta=${REPOSICION_DIAS_ALERTA:3}
