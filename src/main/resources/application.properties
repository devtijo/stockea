spring.config.import=optional:file:.env[.properties]
spring.application.name=stockea
server.port=${PORT:8080}
spring.threads.virtual.enabled=true

# --- Base de datos:
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stockea}
spring.datasource.username=${DB_APP_USER:stockea_app}
spring.datasource.password=${STOCKEA_APP_PASSWORD}

# --- Flyway migra con el rol dueño del esquema
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=${DB_MIGRATOR_USER:stockea_migrator}
spring.flyway.password=${STOCKEA_MIGRATOR_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Identidad: Keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/stockea}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/stockea/protocol/openid-connect/certs}
stockea.keycloak.url-admin=${KEYCLOAK_INTERNAL_URL:http://localhost:8180}
stockea.keycloak.realm=stockea
stockea.keycloak.cliente-id=stockea-api
stockea.keycloak.cliente-secreto=${STOCKEA_API_CLIENT_SECRET}

# --- Negocio
stockea.zona-negocio=${ZONA_NEGOCIO:America/Bogota}

# --- Logs estructurados a stdout (12-Factor XI)
logging.structured.format.console=${LOG_FORMAT:ecs}

# Outbox de eventos de Modulith: la tabla la crea Flyway (V5), nunca la app.
spring.modulith.events.jdbc.schema-initialization.enabled=false
spring.modulith.events.completion-mode=delete
