# Hacia Keycloak (corre con --http-relative-path=/auth y --proxy-headers=xforwarded).
include /etc/nginx/snippets/cabeceras-seguridad.conf;
set $idp keycloak:8080;
proxy_pass http://$idp;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port 443;
proxy_set_header X-Request-Id $request_id;
proxy_buffer_size 128k;              # Keycloak responde con cabeceras grandes
proxy_buffers 4 256k;
proxy_busy_buffers_size 256k;
proxy_read_timeout 30s;
