# Hacia la API (Spring Boot). El backend toma la IP real y el esquema de X-Forwarded-*.
include /etc/nginx/snippets/cabeceras-seguridad.conf;
set $api backend:8080;
proxy_pass http://$api;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;   # se REEMPLAZA: el cliente no puede falsificar su IP
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port 443;
proxy_set_header X-Request-Id $request_id;
proxy_hide_header X-Request-Id;      # la pone el gateway (evita la cabecera duplicada)
proxy_connect_timeout 5s;
proxy_read_timeout 30s;
proxy_send_timeout 30s;
