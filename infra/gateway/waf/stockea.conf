# Ajustes del OWASP CRS para STOCKEA
# Cada exclusión debe tener su motivo: quitar reglas a ciegas es abrir el WAF.

SecComponentSignature "STOCKEA-WAF"

# 1) Keycloak (OIDC): redirect_uri y post_logout_redirect_uri llevan a propósito una URL de
#    "localhost" (https://localhost/... o http://localhost:5173/...). El CRS la ve como intento de
#    SSRF (regla 934190). Se quita SOLO ese argumento, SOLO de esa regla y SOLO bajo /auth/realms/.
SecRule REQUEST_URI "@beginsWith /auth/realms/" \
    "id:1000,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetById=934190;ARGS:redirect_uri,\
    ctl:ruleRemoveTargetById=934190;ARGS:post_logout_redirect_uri"
