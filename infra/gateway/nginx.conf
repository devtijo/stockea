
# STOCKEA - API Gateway de borde
# Responsabilidades del borde: TLS, enrutamiento, límite de peticiones, límite de
# tamaño, cabeceras de seguridad, ocultar lo interno y log de acceso en JSON.
# NO valida el JWT ni roles: eso lo hace el backend en cada petición
# Zero Trust: nadie confía en que "ya pasó por el proxy").

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;              # no anunciar la versión de Nginx (A05)
    sendfile      on;
    keepalive_timeout 30s;

    # Log de acceso estructurado (12-Factor XI). request_id = mismo id que ve el backend.
    log_format json escape=json '{"@timestamp":"$time_iso8601","servicio":"gateway",'
        '"request_id":"$request_id","ip_cliente":"$remote_addr","metodo":"$request_method",'
        '"ruta":"$uri","estado":$status,"bytes":$body_bytes_sent,"duracion_s":$request_time,'
        '"upstream":"$upstream_addr","upstream_s":"$upstream_response_time",'
        '"limite":"$limit_req_status","user_agent":"$http_user_agent"}';
    access_log /dev/stdout json;

    # Límites de tamaño y tiempo (protección básica contra abuso y Slowloris)
    client_max_body_size        1m;     # un lote de sync de 50 ventas pesa ~50 KB
    client_body_timeout         10s;
    client_header_timeout       10s;
    send_timeout                30s;
    large_client_header_buffers 4 16k;  # las cookies de Keycloak son grandes

    # Límite de peticiones por IP (ADR-007/013). 429 = la PWA reintenta (ADR-022).
    limit_req_zone  $binary_remote_addr zone=api:10m      rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=registro:10m rate=5r/m;
    limit_req_zone  $binary_remote_addr zone=login:10m    rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=conexiones:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # DNS interno de Docker: Nginx arranca aunque un servicio aún no exista
    # y vuelve a resolver si el contenedor cambia de IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # HTTP -> HTTPS
    server {
        listen 80;
        server_name _;
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Borde HTTPS
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/stockea.crt;
        ssl_certificate_key /etc/nginx/certs/stockea.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        limit_conn conexiones 50;

        # Solo los métodos que usa la aplicación
        if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
            return 405;
        }

        # Nada de archivos ocultos (.env, .git...), excepto /.well-known/ que usa OIDC
        location ~ /\.(?!well-known/) {
            return 404;
        }

        # Salud pública mínima (sin detalles internos): para monitores externos
        location = /health {
            include /etc/nginx/snippets/cabeceras-seguridad.conf;
            set $gestion backend:8081;
            proxy_pass http://$gestion/actuator/health/readiness;
        }

        # Actuator NUNCA sale por el gateway (métricas y detalles son internos)
        location /actuator {
            return 404;
        }

        # Registro público de negocios: límite estricto contra creación masiva de cuentas
        location = /api/publico/negocios {
            limit_req zone=registro burst=3 nodelay;
            include /etc/nginx/snippets/proxy-backend.conf;
        }

        # API REST (el backend valida el JWT y el rol en cada petición)
        location /api/ {
            limit_req zone=api burst=40 nodelay;
            include /etc/nginx/snippets/proxy-backend.conf;
        }

        # Identity Provider (Keycloak) bajo /auth: consola de administración y realm
        # "master" NO se publican; se administran solo por 127.0.0.1:8180.
        location ~ ^/auth/(admin|realms/master)(/|$) {
            return 403;
        }
        location ~ ^/auth/realms/[^/]+/login-actions/ {
            limit_req zone=login burst=5 nodelay;   # complementa el bloqueo por fuerza bruta de Keycloak
            include /etc/nginx/snippets/proxy-keycloak.conf;
        }
        location /auth/ {
            include /etc/nginx/snippets/proxy-keycloak.conf;
        }

        # PWA (React): todo lo demás
        location / {
            include /etc/nginx/snippets/cabeceras-seguridad.conf;
            # CSP estricta: solo código propio. Mitiga XSS en una app que guarda datos en IndexedDB.
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; manifest-src 'self'; worker-src 'self'" always;
            add_header X-Frame-Options SAMEORIGIN always;
            set $web frontend:8080;
            proxy_pass http://$web;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
        }
    }

    # Métricas de Nginx para Prometheus: puerto interno, no publicado
    server {
        listen 8088;
        server_name _;
        access_log off;
        location = /stub_status {
            stub_status;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny all;
        }
    }
}
