# Servidor de la PWA (detrás del gateway).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Archivos con hash en el nombre: se pueden guardar en caché "para siempre"
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html y silent-check-sso.html siempre frescos (si no, el usuario se queda con una versión vieja)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /silent-check-sso.html {
        add_header Cache-Control "no-cache";
    }
    location = /silent-check-sso.js {
        add_header Cache-Control "no-cache";
    }

    # SPA: cualquier ruta desconocida la resuelve React
    location / {
        try_files $uri /index.html;
    }
}
